<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 506" width="100%" font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif'>
  <title>启动与数据加载流程</title>
  <desc>场景启动后读取路径并进入周期刷新循环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="32" font-size="16" font-weight="500" fill="#2C2C2A">启动与数据加载流程</text>
  <rect x="90" y="56" width="500" height="58" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <circle cx="116" cy="85.0" r="13" fill="#185FA5"/>
  <text x="116" y="85.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="140" y="76.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">载入场景</text>
  <text x="140" y="96.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">Unity 初始化各 MonoBehaviour 组件</text>
  <line x1="340.0" y1="114" x2="340.0" y2="144" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="144" width="500" height="58" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <circle cx="116" cy="173.0" r="13" fill="#0F6E56"/>
  <text x="116" y="173.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="140" y="164.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">读取配置</text>
  <text x="140" y="184.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">从 Text_path 获取 CSV 根目录路径</text>
  <line x1="340.0" y1="202" x2="340.0" y2="232" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="232" width="500" height="58" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <circle cx="116" cy="261.0" r="13" fill="#534AB7"/>
  <text x="116" y="261.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="140" y="252.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">扫描目录</text>
  <text x="140" y="272.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">GetAllFiles() 取 files[Length-2]</text>
  <line x1="340.0" y1="290" x2="340.0" y2="320" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="320" width="500" height="58" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <circle cx="116" cy="349.0" r="13" fill="#5F5E5A"/>
  <text x="116" y="349.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="140" y="340.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">全屏设置</text>
  <text x="140" y="360.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">SetResolution + fullScreen = true</text>
  <line x1="340.0" y1="378" x2="340.0" y2="408" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="408" width="500" height="58" rx="8" fill="#FCE7EF" stroke="#EC9BC0" stroke-width="0.5"/>
  <circle cx="116" cy="437.0" r="13" fill="#9C3D68"/>
  <text x="116" y="437.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="140" y="428.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">周期刷新</text>
  <text x="140" y="448.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">FixedUpdate 中调用 ImportCSV()</text>
</svg>